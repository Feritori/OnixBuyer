# ─────────────────────────────────────────────────────────────────────────────
# OnixBuyer — полная конфигурация
# ─────────────────────────────────────────────────────────────────────────────

# Горячие товары
hot-items-interval-ticks: 360000
hot-item-price: 5000.0
hot-item-max-sell: 5
hot-items-count: 3

# XP за продажу 1 предмета
xp-per-item: 1

# XP для каждого уровня
level-xp:
  1: 500
  2: 1500
  3: 3500
  4: 7000
  5: 12000
  6: 20000
  7: 32000
  8: 50000
  9: 75000
  10: 100000

# ─────────────────────────────────────────────────────────────────────────────
# Категории скупщика
